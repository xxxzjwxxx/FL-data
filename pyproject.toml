[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fl-pod-aki"
version = "1.0.0"
description = "Configurable centralized and federated MLP workflows for binary clinical prediction"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "imbalanced-learn==0.12.0",
  "numpy==1.23.5",
  "openpyxl==3.1.2",
  "pandas==1.5.3",
  "scikit-learn==1.3.2",
  "torch==2.1.1",
]

[project.optional-dependencies]
test = ["pytest==8.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
